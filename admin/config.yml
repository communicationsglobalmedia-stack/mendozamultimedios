backend:
  name: git-gateway
  branch: main # Si tu rama en GitHub se llama "master", cambiá "main" por "master"

media_folder: "img/noticias" # Carpeta donde se suben las fotos
public_folder: "/img/noticias"

collections:
  - name: "noticias"
    label: "Noticias del Portal"
    label_singular: "Noticia"
    folder: "datos/noticias" # Carpeta donde se guardan las notas en JSON
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Titular Principal", name: "titulo", widget: "string", required: true }
      - label: "Sección / Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Mendoza & Región Cuyo (Portada Principal)", value: "mendoza" }
          - { label: "Ámbito Nacional (Argentina)", value: "nacional" }
          - { label: "Panorama Internacional", value: "internacional" }
          - { label: "América Latina", value: "latinoamerica" }
          - { label: "EEUU", value: "eeuu" }
          - { label: "Europa", value: "europa" }
          - { label: "Medio Oriente", value: "mediooriente" }
          - { label: "Asia Oriental y Central", value: "asia" }
        default: "mendoza"
      - { label: "Bajada / Copete (Resumen corto)", name: "bajada", widget: "text", required: true }
      - { label: "Imagen de Portada", name: "imagen", widget: "image", required: false }
      - { label: "Fuente / Redactor", name: "fuente", widget: "string", default: "Redacción Mendoza Multimedios" }
      - { label: "Fecha de Publicación", name: "fecha", widget: "datetime" }
      - { label: "Cuerpo de la Nota", name: "cuerpo", widget: "markdown", required: false }